<!DOCTYPE html>
<!--
  Preview entry for the Baldor Specialty Foods Design System.
  Fonts loaded as non-blocking <link> tags.

  SUBSTITUTIONS (proprietary fonts → free Google Fonts equivalents):
  - Ruder Plakat   → Barlow Condensed  (condensed poster display; weight 400–900)
  - Herbik         → DM Sans           (body/UI sans; ital + wght 300–700)
  - FT Polar       → Space Grotesk     (accent kicker; weight 300–700)
  Helvetica Neue is a system-font fallback already in the DM Sans stack.
-->
<html lang="en" style="height: 100%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <title>Baldor Specialty Foods Design System</title>
    <meta name="description" content="Baldor Specialty Foods Design System — cream, forest green, and lime. Editorial and confident." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Space+Grotesk:wght@300..700&display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Space+Grotesk:wght@300..700&display=swap"></noscript>
  </head>
  <body style="height: 100%; margin: 0">
    <div id="root" style="height: 100%"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
